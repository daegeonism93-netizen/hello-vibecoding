
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사 페이지</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: Arial, sans-serif;
  }

  .box {
    background: white;
    padding: 50px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  h1 { color: #333; }
  p { color: #666; }

  button {
    padding: 12px 25px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="box">
  <h1>👋 안녕하세요!</h1>
  <p id="message">제 홈페이지에 오신 것을 환영합니다.</p>
  <button onclick="hello()">인사하기</button>
</div>

<script>
function hello() {
  document.getElementById("message").innerText =
    "😊 만나서 반갑습니다! 좋은 하루 보내세요!";
}
</script>

</body>
</html>
